name: Release & Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase Repository Owner & Name
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up QEMU (multi-arch optional)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.REPO_LOWER }}:main

  helm-deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      RELEASE_NAME: synara
      NAMESPACE: synara
      IMAGE_REPO: ghcr.io/${{ github.repository }}/feedback_processor_theory
      IMAGE_TAG: main
      CAP_TOKEN_SECRET: ${{ secrets.CAP_TOKEN_SECRET }}
      WHISPER_SECRET: ${{ secrets.WHISPER_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Configure kubeconfig (token)
        run: |
          mkdir -p ~/.kube
          echo "apiVersion: v1" > ~/.kube/config
          echo "clusters: []" >> ~/.kube/config
          echo "contexts: []" >> ~/.kube/config
          echo "current-context: ''" >> ~/.kube/config
          echo "users: []" >> ~/.kube/config

      - name: Create namespace (idempotent)
        run: |
          kubectl create ns ${NAMESPACE} --dry-run=client -o yaml || true

      - name: Helm upgrade --install
        run: |
          helm upgrade --install ${RELEASE_NAME} ./helm/synara             --namespace ${NAMESPACE}             --set image.repository=${IMAGE_REPO}             --set image.tag=${IMAGE_TAG}             --dry-run || true
