name: FPT-Omega 8-Cloud Resonance

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs every 6 hours
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  resonate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run 8-Cloud Resonance
        run: python fpt_omega_8cloud.py

      - name: Update Local Dashboard Output
        run: |
          mkdir -p build
          echo "<h1>FPT-Omega 8-Cloud Resonance Grid Active</h1>" > build/resonance.html
