name: Firecrawl Scraping & Mesh Ingestion Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      mesh_batch:
        description: "JSON batch from mesh_relay (FPT frames)"
        required: false
        type: string
      source_node:
        description: "Primary node ID / IP"
        required: false
        type: string
        default: "192.168.1.226"

jobs:
  scrape-and-inscribe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Ingest Mesh Batch
        if: ${{ inputs.mesh_batch != '' }}
        run: |
          echo '${{ inputs.mesh_batch }}' > mesh_batch.json
          python -c "import json; data=json.load(open('mesh_batch.json')); print(f'Ingested {data.get(\"count\", len(data.get(\"frames\", [])))} frame(s) from node ${{ inputs.source_node }}')"

      - name: Firecrawl Scrape
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          pip install firecrawl-py pydantic httpx python-dotenv
          if [ -f "src/scrape_theory/firecrawl_fusion.py" ]; then
            python src/scrape_theory/firecrawl_fusion.py
          else
            python -c "import os; print('Firecrawl Pipeline Active. Key active:', bool(os.getenv('FIRECRAWL_API_KEY')))"
          fi

      - name: Inscribe Codex
        run: |
          echo "Executing Codex Inscription payload..."
