name: Engine Invariant Verification CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio numpy

      - name: Run Test Suite
        run: |
          pytest -v --cov=living_zero_core --cov=living_zero_projection --cov=ingestion_recovery --cov=async_dispatch_pipeline --cov=async_projection_service --cov-report=term-missing

      - name: Run Invariant & Spectral Radius Benchmarks
        run: |
          PYTHONPATH=. python3 benchmarks/benchmark.py
