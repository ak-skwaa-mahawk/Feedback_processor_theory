[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "feedback-processor-theory"
version = "0.1.0"
description = "Deterministic orthogonal projections, async dispatch pipelines, and cryptographic state verification."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["fpt", "fpt.*"]
